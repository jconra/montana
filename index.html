<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Terrain — Paradise Valley</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;font-family:system-ui,sans-serif;color:#e6edf3}
  #c{display:block;width:100%;height:100%}
  .card{position:fixed;z-index:10;background:rgba(13,17,23,.75);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5}
  #hud{top:10px;left:10px}
  #hud b{color:#7ee787}
  #panel{bottom:10px;left:10px;max-height:78vh;overflow:auto}
  #fab{position:fixed;bottom:10px;left:10px;z-index:12;width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1;display:none;cursor:pointer;color:#7ee787}
  #min{padding:0 9px;font-size:15px;line-height:1.2}
  #stats{bottom:10px;right:10px;font:11px/1.5 monospace;color:#7ee787}
  #panel .sec{margin-top:7px;padding-top:6px;border-top:1px solid #2a3038;color:#9aa4af;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  #panel label{display:flex;align-items:center;gap:8px;margin-top:4px}
  input[type=range]{width:120px}
  select,button{cursor:pointer;background:#21262d;color:#e6edf3;border:1px solid #444;border-radius:6px;padding:4px 8px}
  #info{top:10px;right:10px;max-width:210px;color:#ffd479}
  #compass{position:fixed;z-index:10;top:120px;right:10px;width:52px;height:52px;background:rgba(13,17,23,.75);border-radius:50%;font-size:11px}
  #compass span{position:absolute;left:50%;transform:translateX(-50%);top:4px;color:#ff7b72;font-weight:bold}
  #ov{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;opacity:.5;pointer-events:none;display:none;z-index:5}
  #err{position:fixed;bottom:0;left:0;right:0;background:#7d1d1d;color:#fff;font:12px monospace;padding:6px;white-space:pre-wrap;display:none;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="ov">
<div id="hud" class="card">loading…</div>
<div id="info" class="card">tap the terrain to read coordinates</div>
<div id="compass"><span>N</span></div>
<div id="panel" class="card">
  <a href="./labs/" style="color:#7ee787">Open labs →</a>
  <label style="justify-content:space-between;margin:0 0 2px"><b style="color:#7ee787">Tools</b> <button id="min">–</button></label>
  <label>vertical scale <input id="vex" type="range" min="0.5" max="3" step="0.1" value="1"><span id="vexv">1.0×</span></label>
  <label><button id="mode">show elevation colors</button></label>
  <label>ground detail <input id="groundDetail" type="checkbox" checked></label>

  <div class="sec">structures</div>
  <label><select id="type"><option value="garage">Garage + Apartment</option><option value="house">Main House</option><option value="cabin">Cabin</option></select> <button id="place">＋ add</button> <button id="undo">undo</button></label>

  <div class="sec">selected — tap a building, drag to move</div>
  <label>heading <input id="head" type="range" min="0" max="360" step="1" value="0"><span id="headv">0°</span></label>
  <label>size <input id="size" type="range" min="0.4" max="2" step="0.02" value="1"><span id="sizev">1.00×</span></label>
  <label>nudge 1m <button id="nw">W</button><button id="ne">E</button><button id="nn">N</button><button id="ns">S</button></label>
  <div id="selinfo" style="font-size:11px;color:#9aa4af;margin-top:3px">none selected</div>

  <div class="sec">layout data</div>
  <label><button id="copy">copy layout</button> <button id="topview">top view</button></label>
  <textarea id="dump" rows="5" style="width:182px;font:11px monospace;background:#0d1117;color:#7ee787;border:1px solid #333;margin-top:3px" readonly></textarea>

  <div class="sec">trees (from LiDAR)</div>
  <label>style <select id="treeStyle"><option value="spiky">spiky (textured)</option><option value="lowpoly">low-poly</option><option value="cross2">billboards ×2</option><option value="cross3">billboards ×3</option></select></label>
  <label>show <input id="treeN" type="range" min="0" max="45000" step="500" value="18000"><span id="treeNv">18000</span></label>
  <label>billboard size <input id="bbSize" type="range" min="0.5" max="1.8" step="0.02" value="1"><span id="bbSizev">1.00</span></label>
  <label>billboard y <input id="bbY" type="range" min="-0.4" max="0.3" step="0.01" value="0"><span id="bbYv">0.00</span></label>
  <label><button id="reseed">rebuild</button></label>
  <label><button id="rmtree">remove tree</button> <button id="cptree">copy removed</button></label>

  <div class="sec">vehicle</div>
  <label><button id="drive">drive the RAV4</button></label>
  <label>drive <button id="dU">▲</button><button id="dD">▼</button><button id="dL">◀</button><button id="dR">▶</button></label>
  <div style="font-size:10px;color:#9aa4af">arrows / WASD, or hold buttons · chase-cam lines up behind it</div>

  <div class="sec">route / sim</div>
  <label><button id="radd">add waypoints</button> <button id="rclear">clear</button></label>
  <label><button id="rdrive">drive route</button> <button id="rintro">▶ play intro</button></label>
  <label><button id="rcopy">copy route</button></label>
  <textarea id="rdump" rows="2" style="width:182px;font:11px monospace;background:#0d1117;color:#7ee787;border:1px solid #333" readonly></textarea>

  <div class="sec">photo match</div>
  <label>photo <input id="photo" type="file" accept="image/*" style="width:150px"></label>
  <label>fade <input id="ovop" type="range" min="0" max="1" step="0.05" value="0.5"> <button id="ovtog">hide</button></label>
  <label>lens FOV <input id="fov" type="range" min="35" max="95" step="1" value="55"><span id="fovv">55°</span></label>
  <label><button id="stand">stand at marker</button> <button id="dropcam">drop camera</button></label>
</div>
<button id="fab" class="card">＋</button>
<div id="stats" class="card">–</div>
<div id="err"></div>
<script>window.onerror=(m,s,l)=>{const e=document.getElementById('err');e.style.display='block';e.textContent+=m+' @'+l+'\n';};</script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
}}
</script>
<script type="module">
import * as THREE from 'three';
// Keep the existing authored colors while upgrading the runtime.
THREE.ColorManagement.enabled=false;
// r158 still falls back to WebGL1; ?webgl=1 explicitly selects it.
const Renderer=new URLSearchParams(location.search).get('webgl')==='1' ? THREE.WebGL1Renderer : THREE.WebGLRenderer;
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { createGroundDetail, rockGeometry, rockMaterial, loadShrub } from './assets/ground-detail.js';
import { buildHouse } from './assets/house-model.js';

const M = await (await fetch('./assets/manifest.json')).json();
let houseSchema=null; try{ houseSchema=await (await fetch('./assets/montana-home.json')).json(); }catch(e){}   // redesigned house
const gmin = M.globalMin, relief = M.globalMax - M.globalMin;
const loadBin = async u => new Float32Array(await (await fetch(u)).arrayBuffer());
const [cData, fData] = await Promise.all([loadBin('./assets/'+M.coarse.bin), loadBin('./assets/'+M.fine.bin)]);

const cHalf = (M.coarse.W-1)*M.coarse.px/2;   // ~750 m
const fHalf = (M.fine.W-1)*M.fine.px/2;       // ~250 m

const renderer = new Renderer({canvas:c, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
// Preserve the scene lighting authored before r155.
renderer.useLegacyLights=true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb8d0);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1.5, 120000);
cam.position.set(420, relief*1.4+320, 620);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xbcd4ff,0x2a2420,0.6));
const sun = new THREE.DirectionalLight(0xfff2d8,1.4); sun.position.set(-1,1.3,-0.6); scene.add(sun);

// ---- gradient sky dome + atmospheric haze ----
const HAZE=new THREE.Color(0xc2d4e2);
scene.background=HAZE.clone();
scene.fog=new THREE.Fog(HAZE, 5000, 30000);          // only distant (>5km) fades; near scene stays clear
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false,
  uniforms:{zen:{value:new THREE.Color(0x2f6fbf)}, mid:{value:new THREE.Color(0x8fbfe6)}, hor:{value:HAZE.clone()}},
  vertexShader:'varying vec3 vp; void main(){vp=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying vec3 vp; uniform vec3 zen,mid,hor; void main(){float h=clamp(normalize(vp).y,0.0,1.0); vec3 c=mix(hor,mid,smoothstep(0.0,0.28,h)); c=mix(c,zen,smoothstep(0.22,0.8,h)); gl_FragColor=vec4(c,1.0);}'});
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(60000,24,14),skyMat); skyDome.renderOrder=-1000; scene.add(skyDome);

// shared aerial texture
const tex = new THREE.TextureLoader().load('./assets/'+M.coarse.aerial);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

function ramp(t){
  const s=[[0,0x2d4a1e],[0.35,0x5a6b33],[0.6,0x8a7a4e],[0.82,0x8f8175],[1,0xd9d2c4]];
  for(let i=0;i<s.length-1;i++){const[a,ca]=s[i],[b,cb]=s[i+1];
    if(t<=b){const u=(t-a)/(b-a);return[((ca>>16&255)+((cb>>16&255)-(ca>>16&255))*u)/255,
      ((ca>>8&255)+((cb>>8&255)-(ca>>8&255))*u)/255,((ca&255)+((cb&255)-(ca&255))*u)/255];}}
  return[1,1,1];
}

const DRIVEWAY=[[26.6,422.4],[15.2,381.4],[18.7,366.1],[28.7,355],[41.2,347.1],[49.8,340.4],[56.8,331.2],[65.3,314.4],[71.9,289.9],[75.6,269.2],[76.5,249.1],[74.3,219.6],[69.8,190],[71.2,163.8],[76.7,139.6],[86,118.1],[98,101],[110.7,85.6],[120.2,76.3],[123.1,72.2],[125.1,65.4],[126.9,52.3],[126.1,43.1],[119.5,37],[108.1,33.9],[96.5,29.7],[85,22.5],[77.6,16.7],[67.2,9.6],[56,6.1],[46.4,4],[35.1,2.3],[26.5,1.2],[10.7,-2.3],[-4.1,-1.4],[-22.9,6.4]].map(([E,N])=>({x:E,z:-N}));
const groundDetail=createGroundDetail(cHalf,DRIVEWAY);
// ---- terrain tiles ------------------------------------------------------
const mats=[]; const tiles=[];
function buildTile(data,W,H,px,uvRect,pushBack){
  const half=(W-1)*px/2;
  const geo=new THREE.PlaneGeometry(2*half,2*half,W-1,H-1);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position, uv=geo.attributes.uv, col=new Float32Array(pos.count*3);
  const baseY=new Float32Array(pos.count);
  const [u0,v0,u1,v1]=uvRect;
  for(let i=0;i<pos.count;i++){
    const e=data[i]; baseY[i]=e-gmin;
    const t=relief>0?(e-gmin)/relief:0; const [r,g,b]=ramp(t);
    col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;
    uv.setXY(i, u0+uv.getX(i)*(u1-u0), v0+uv.getY(i)*(v1-v0));
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:1,metalness:0});
  if(pushBack){mat.polygonOffset=true;mat.polygonOffsetFactor=1;mat.polygonOffsetUnits=1;}
  const mesh=new THREE.Mesh(geo,mat);
  scene.add(mesh); mats.push(mat);
  const t={mesh,pos,baseY,W,H,px,half,data};
  tiles.push(t); return t;
}
const fu=fHalf/cHalf, uv0=0.5-fu*0.5, uv1=0.5+fu*0.5;
const coarse=buildTile(cData,M.coarse.W,M.coarse.H,M.coarse.px,[0,0,1,1],true);
const fine  =buildTile(fData,M.fine.W,  M.fine.H,  M.fine.px,[uv0,uv0,uv1,uv1],false);
for(const material of mats)groundDetail.attach(material);

// ---- height sampling ----------------------------------------------------
let VEX=1;
function sampleBase(x,z,t){
  const i=(x+t.half)/t.px, j=(z+t.half)/t.px;
  if(i<0||j<0||i>t.W-1||j>t.H-1) return null;
  const i0=Math.floor(i),j0=Math.floor(j),fx=i-i0,fy=j-j0;
  const i1=Math.min(i0+1,t.W-1),j1=Math.min(j0+1,t.H-1);
  const a=t.baseY[j0*t.W+i0],b=t.baseY[j0*t.W+i1],cc=t.baseY[j1*t.W+i0],d=t.baseY[j1*t.W+i1];
  return (a*(1-fx)+b*fx)*(1-fy)+(cc*(1-fx)+d*fx)*fy;
}
function heightAt(x,z){
  let v=(Math.abs(x)<=fine.half&&Math.abs(z)<=fine.half)?sampleBase(x,z,fine):null;
  if(v==null) v=sampleBase(x,z,coarse);
  return (v==null?0:v)*VEX;
}

// ---- building models ----------------------------------------------------
const placed=[];
const MAT=(c,r=.9,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,flatShading:true});
const COL={side:0x352a20, trim:0xece9e0, roof:0x2e3033, glass:0x28323b,
           wood:0xba8a4e, stone:0x6b6560, garage:0xbcac91, tank:0xd6d2c6};
function box(p,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);p.add(m);return m;}
// gable roof, ridge along Z, gable ends face +Z / -Z. baseY = eave height.
function gableRoof(p,w,d,rh,baseY,eave,mat){
  const s=new THREE.Shape();s.moveTo(-w/2-eave,0);s.lineTo(w/2+eave,0);s.lineTo(0,rh);s.lineTo(-w/2-eave,0);
  const r=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d+2*eave,bevelEnabled:false}),mat);
  r.position.set(0,baseY,-(d/2+eave));p.add(r);return r;
}
// gable roof with ridge along X (E–W); slopes face ±Z, gable ends (siding) face ±X
function gableRoofX(g,w,d,rh,baseY,eave,roofMat,gableMat){
  const D=d/2+eave, ang=Math.atan2(rh,D), sl=Math.hypot(D,rh), W=w+2*eave;
  box(g,W,0.12,sl,0,baseY+rh/2, D/2,roofMat).rotation.x= ang;
  box(g,W,0.12,sl,0,baseY+rh/2,-D/2,roofMat).rotation.x=-ang;
  for(const sx of [-1,1]){const s=new THREE.Shape();s.moveTo(-d/2,0);s.lineTo(d/2,0);s.lineTo(0,rh);s.lineTo(-d/2,0);
    const t=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:0.12,bevelEnabled:false}),gableMat);
    t.rotation.y=Math.PI/2; t.position.set(sx*w/2,baseY,0); g.add(t);}
}
// small gabled dormer sitting on the front (+Z) slope, window facing +Z
function dormer(g,cx,zc,yc,side,roof,glass,trim){
  const dw=1.9,dh=1.6,dd=1.6,drh=0.9;
  box(g,dw,dh,dd,cx,yc+dh/2,zc,side);
  const s=new THREE.Shape();s.moveTo(-dw/2-0.15,0);s.lineTo(dw/2+0.15,0);s.lineTo(0,drh);s.lineTo(-dw/2-0.15,0);
  const r=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:dd+0.3,bevelEnabled:false}),roof);
  r.position.set(cx,yc+dh,zc-(dd/2+0.15)); g.add(r);
  box(g,1.1,1.0,0.1,cx,yc+dh*0.52,zc+dd/2+0.05,glass);
  box(g,1.35,1.25,0.05,cx,yc+dh*0.52,zc+dd/2+0.02,trim);
}

// build a Three.js group from the box-part schema (auto-material: walls / roof / deck)
function buildFromParts(schema){
  const g=new THREE.Group(), S=0.5;                          // scale designer units → ~metres
  const sideMat=MAT(0x3a2f24), roofMat=MAT(0x33363a,.5,.35), deckMat=MAT(0x795c3a), trimMat=MAT(0xd8d4c8);
  const wdim=p=>[p.params.w*(p.scale?p.scale[0]||1:1), p.params.d*(p.scale?p.scale[2]||1:1)];
  for(const p of schema.parts){
    if(p.kind!=='box') continue;
    const P=p.params, y=p.pos[1]||0, tilted=p.rot&&((p.rot[2]||0)!==0);
    let mat=sideMat;
    if(tilted || (P.h<=0.4 && y>2)) mat=roofMat;             // tilted board / high thin slab = roof
    else if(P.h<=0.4) mat=deckMat;                           // low thin slab = deck/floor
    else if(Math.min(P.w,P.d)<=0.25 && P.h<=6) mat=trimMat;  // short thin panel = window/rail trim
    const m=new THREE.Mesh(new THREE.BoxGeometry(P.w*S,P.h*S,P.d*S),mat);
    m.position.set((p.pos[0]||0)*S, y*S, (p.pos[2]||0)*S);
    if(p.rot)   m.rotation.set(p.rot[0]||0,p.rot[1]||0,p.rot[2]||0);
    if(p.scale) m.scale.set(p.scale[0]||1,p.scale[1]||1,p.scale[2]||1);
    g.add(m);
  }
  // ---- auto roof over the open-topped shell ----
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9,eastTop=0,westTop=0;
  for(const p of schema.parts){if(p.params.h<3)continue; const[w,d]=wdim(p),x=p.pos[0]||0,z=p.pos[2]||0;
    minX=Math.min(minX,x-w/2);maxX=Math.max(maxX,x+w/2);minZ=Math.min(minZ,z-d/2);maxZ=Math.max(maxZ,z+d/2);}
  for(const p of schema.parts){if(p.params.h<3)continue; const x=p.pos[0]||0,t=(p.pos[1]||0)+p.params.h/2;
    if(x>maxX-4)eastTop=Math.max(eastTop,t); if(x<minX+4)westTop=Math.max(westTop,t);}
  const midX=(minX+maxX)/2, ov=3, zc=(minZ+maxZ)/2, zd=(maxZ-minZ+ov*2);
  const slab=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)+ov,ang=Math.atan2(dy,dx);
    const m=new THREE.Mesh(new THREE.BoxGeometry(len*S,0.5*S,zd*S),roofMat);
    m.position.set((x1+x2)/2*S,(y1+y2)/2*S,zc*S); m.rotation.z=ang; g.add(m);};
  const ridge=eastTop+4, eMid=(midX+maxX)/2;
  slab(midX,eastTop, eMid,ridge); slab(eMid,ridge, maxX+1,eastTop-1);   // gable over the tall east block
  slab(minX-1,westTop+1.5, midX,westTop+2.5);                          // low shed over the west wing
  if(eastTop-westTop>2){const sw=new THREE.Mesh(new THREE.BoxGeometry(0.4*S,(eastTop-westTop+4)*S,(maxZ-minZ)*S),sideMat);
    sw.position.set(midX*S,(westTop+eastTop)/2*S,zc*S); g.add(sw);}   // step wall between wing and block
  return g;
}
// the Home Designer works in FEET; montana's world is metres (USGS LiDAR). Bake the conversion
// into the geometry (flattened) so optimizeGroup can still merge it and the placement scale slider works.
const FT=0.3048;
function bakedFt(src){ src.scale.setScalar(FT); src.updateMatrixWorld(true);
  const out=new THREE.Group();
  src.traverse(o=>{ if(o.isMesh && o.geometry){ const g2=o.geometry.clone(); g2.applyMatrix4(o.matrixWorld);
    const mat=Array.isArray(o.material)?o.material[0]:o.material;   // two-tone walls carry a material array; collapse to the exterior one for the distant terrain view
    out.add(new THREE.Mesh(g2,mat)); } });
  // centre on the footprint (X/Z) so it lands where the old origin-centred model did; keep the base on the ground (Y)
  const bb=new THREE.Box3().setFromObject(out), cx=(bb.min.x+bb.max.x)/2, cz=(bb.min.z+bb.max.z)/2;
  out.children.forEach(m=>m.geometry.translate(-cx,0,-cz));
  return out; }
function makeHouse(){
  const saved=localStorage.getItem('montanaHouse');                  // live design from the Home Designer (same-origin)
  if(saved){ try{ const h=buildHouse(THREE, JSON.parse(saved)); if(h.children.length) return bakedFt(h); }catch(e){} }
  if(houseSchema){ try{ const h=buildHouse(THREE, houseSchema); if(h.children.length) return bakedFt(h); }catch(e){} }   // committed montana-home.json
  const g=new THREE.Group(), w=15,d=9,wh=6.2,rh=4.6,eave=0.7,fh=0.6;
  const side=MAT(COL.side),trim=MAT(COL.trim),roof=MAT(COL.roof,.45,.35),glass=MAT(COL.glass,.3),
        stone=MAT(COL.stone),tank=MAT(COL.tank,.5,.2),wood=MAT(COL.wood),pipe=MAT(0x242424,.5,.4);
  box(g,w+0.6,fh,d+0.6,0,fh/2,0,stone);
  box(g,w,wh,d,0,fh+wh/2,0,side);
  gableRoofX(g,w,d,rh,fh+wh,eave,roof,side);
  const wt=fh+wh, sang=Math.atan2(rh,d/2+eave);
  dormer(g,-4.2,2.3,wt+1.3,side,roof,glass,trim);                  // left gabled dormer
  dormer(g, 4.2,2.3,wt+1.3,side,roof,glass,trim);                  // right gabled dormer
  for(const x of [-1.5,1.5]) box(g,1.5,0.12,1.4,x,wt+rh*0.6,1.1,glass).rotation.x=sang;   // two skylights
  {const p=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,2.6,10),pipe);p.position.set(-5.6,wt+rh*0.55+1.0,-0.6);g.add(p);}  // stovepipe
  const zf=d/2+0.05;

function matKey(m){ if(Array.isArray(m)) m=m[0]; if(!m||!m.color) return 'x'; return (m.map?'t':'')+m.color.getHexString()+'_'+m.roughness+'_'+m.metalness+(m.flatShading?'f':'');}
function optimizeGroup(g){
  const groups=new Map();
  for(const o of [...g.children]){
    if(!o.isMesh || !o.geometry.attributes.uv) continue;
    o.updateMatrix(); const geo=o.geometry.clone().applyMatrix4(o.matrix);
    const k=matKey(o.material);
    if(!groups.has(k)) groups.set(k,{mat:o.material,geos:[]});
    groups.get(k).geos.push(geo); g.remove(o);
  }
  for(const {mat,geos} of groups.values()){
    // Keep the existing individual-mesh fallback for mixed boxes/extrusions.
    const mixedIndices=geos.some(geo=>Boolean(geo.index)!==Boolean(geos[0].index));
    const merged=mixedIndices ? null : mergeGeometries(geos,false);
    if(merged) g.add(new THREE.Mesh(merged,mat)); else geos.forEach(ge=>g.add(new THREE.Mesh(ge,mat)));

}

function applyVex(v){
  VEX=v;
  for(const t of tiles){for(let i=0;i<t.pos.count;i++)t.pos.setY(i,t.baseY[i]*v);t.pos.needsUpdate=true;t.mesh.geometry.computeVertexNormals();}
  for(const o of placed) o.group.position.y=heightAt(o.x,o.z);
  for(const {im,list} of treeMeshes){for(let i=0;i<list.length;i++){const t=list[i];
    _o.position.set(t.x,heightAt(t.x,t.z),t.z);_o.rotation.set(0,t.r,0);_o.scale.setScalar(t.s);_o.updateMatrix();im.setMatrixAt(i,_o.matrix);}
    im.instanceMatrix.needsUpdate=true;}
  for(const {im,list} of groundMeshes){for(let i=0;i<list.length;i++){const t=list[i];
    _o.position.set(t.x,heightAt(t.x,t.z)+(t.dy||0),t.z);_o.rotation.set(t.rx||0,t.r,0);_o.scale.set(t.s,t.s*(t.sy||1),t.s);_o.updateMatrix();im.setMatrixAt(i,_o.matrix);}
    im.instanceMatrix.needsUpdate=true;}
  if(marker) marker.position.y=heightAt(marker.position.x,marker.position.z)+2;
}

// ---- tap to inspect + move marker --------------------------------------
const marker=new THREE.Mesh(new THREE.ConeGeometry(3,10,8),new THREE.MeshStandardMaterial({color:0xff5555,flatShading:true}));
marker.rotation.x=Math.PI; scene.add(marker); marker.position.set(0,heightAt(0,0)+2,0);
const info=document.getElementById('info');
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let dragging=null;
function evNdc(ev){const r=renderer.domElement.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX), cy=(ev.touches?ev.touches[0].clientY:ev.clientY);
  ndc.x=((cx-r.left)/r.width)*2-1; ndc.y=-((cy-r.top)/r.height)*2+1; ray.setFromCamera(ndc,cam);}
function updateSelInfo(){ if(!sel)return; const g=sel.group, deg=Math.round(((THREE.MathUtils.radToDeg(g.rotation.y))%360+360)%360);
  document.getElementById('selinfo').innerHTML=`<b>${sel.type}</b> · E ${sel.x.toFixed(1)} N ${(-sel.z).toFixed(1)} · ${deg}° · ${g.scale.x.toFixed(2)}×`; }
function selectRec(rec){ sel=rec; const g=rec.group, deg=Math.round(((THREE.MathUtils.radToDeg(g.rotation.y))%360+360)%360);
  document.getElementById('head').value=deg; document.getElementById('headv').textContent=deg+'°';
  document.getElementById('size').value=+g.scale.x.toFixed(2); document.getElementById('sizev').textContent=g.scale.x.toFixed(2)+'×';
  updateSelInfo(); }
function nudge(de,dn){ if(!sel)return; sel.x+=de; sel.z-=dn; sel.group.position.set(sel.x,heightAt(sel.x,sel.z),sel.z); updateSelInfo(); }
function dumpLayout(){ return placed.map(o=>({type:o.type, E:+o.x.toFixed(1), N:+(-o.z).toFixed(1),
  heading:Math.round(((THREE.MathUtils.radToDeg(o.group.rotation.y))%360+360)%360), scale:+o.group.scale.x.toFixed(2)})); }

renderer.domElement.addEventListener('pointerdown',ev=>{
  evNdc(ev);
  if(routeAdd){const h=ray.intersectObjects([coarse.mesh,fine.mesh])[0]; if(h) addWaypoint(h.point.x,h.point.z); return;}
  if(driveMode) return;                                            // no building editing while driving
  const sh=ray.intersectObjects(placed.map(o=>o.group),true)[0];   // grab a building → select + start drag
  if(sh){let g=sh.object; while(g.parent&&!placed.some(o=>o.group===g)) g=g.parent;
    const rec=placed.find(o=>o.group===g);
    if(rec){selectRec(rec); dragging=rec; controls.enabled=false; return;}}
  const th=ray.intersectObjects(treeMeshes.map(m=>m.im))[0];       // click a tree → get its id
  if(th && th.instanceId!=null){
    const entry=treeMeshes.find(m=>m.im===th.object), t=entry&&entry.list[th.instanceId];
    if(t){ selTree=t; info.innerHTML=`🌲 tree #${t.id}<br>E ${t.x.toFixed(1)} · N ${(-t.z).toFixed(1)}<br>use "remove tree" to delete it`; return; }
  }
  const hit=ray.intersectObjects([coarse.mesh,fine.mesh])[0]; if(!hit) return;
  const p=hit.point; marker.position.set(p.x,p.y+2,p.z);
  const east=p.x, north=-p.z, elev=gmin+p.y/VEX;
  const lat=M.center.lat+north/111132, lon=M.center.lon+east/(111320*Math.cos(M.center.lat*Math.PI/180));
  info.innerHTML=`marker<br>E ${east.toFixed(1)} m · N ${north.toFixed(1)} m<br>elev ${elev.toFixed(0)} m (${(elev*3.28084).toFixed(0)} ft)<br>${lat.toFixed(6)}, ${lon.toFixed(6)}`;
});
renderer.domElement.addEventListener('pointermove',ev=>{
  if(!dragging) return;
  evNdc(ev);
  const hit=ray.intersectObjects([coarse.mesh,fine.mesh])[0]; if(!hit) return;
  dragging.x=hit.point.x; dragging.z=hit.point.z;
  dragging.group.position.set(dragging.x,heightAt(dragging.x,dragging.z),dragging.z); updateSelInfo();
});
addEventListener('pointerup',()=>{ if(dragging){dragging=null; controls.enabled=true;} });

// ---- driveable Toyota RAV4 (third-person camera orbits it) --------------
const wheels=[];
function wheel(){
  const g=new THREE.CylinderGeometry(0.36,0.36,0.28,14); g.rotateZ(Math.PI/2);
  const m=new THREE.Mesh(g,MAT(0x141414,.7));
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.30,8),MAT(0x888888,.5,.4)); hub.rotation.z=Math.PI/2; m.add(hub);
  return m;
}
function makeRav4(){
  const g=new THREE.Group();
  const body=MAT(0xededed,.5,.1), clad=MAT(0x20242b,.5), glass=MAT(0x2a3038,.2,.3), blk=MAT(0x1a1a1a,.6),
        red=MAT(0x8a1a1a,.4), lamp=MAT(0xf7f4e0,.3);
  box(g,1.85,0.7,4.3,0,0.75,0,body);                 // main body
  box(g,1.9,0.34,4.35,0,0.5,0,clad);                 // lower cladding
  box(g,1.72,0.72,2.5,0,1.36,-0.1,body);             // cabin
  box(g,1.75,0.5,2.32,0,1.34,-0.1,glass);            // window band
  box(g,1.6,0.12,2.4,0,1.74,-0.1,body);              // roof
  for(const sx of [-0.7,0.7]) box(g,0.06,0.09,2.2,sx,1.82,-0.1,blk);   // roof rails
  for(const sx of [-0.62,0.62]){box(g,0.46,0.22,0.06,sx,0.9,2.16,lamp); box(g,0.46,0.22,0.06,sx,1.0,-2.16,red);}
  box(g,1.86,0.3,0.22,0,0.55,2.18,clad); box(g,1.86,0.3,0.22,0,0.55,-2.18,clad);  // bumpers
  const wx=0.98,wz=1.45;
  for(const [sx,sz] of [[-wx,wz],[wx,wz],[-wx,-wz],[wx,-wz]]){const w=wheel();w.position.set(sx,0.36,sz);g.add(w);wheels.push(w);}
  return g;
}
const car={x:16,z:-14,heading:Math.PI,speed:0,group:makeRav4()};
scene.add(car.group);
car.group.position.set(car.x,heightAt(car.x,car.z),car.z); car.group.rotation.y=car.heading;

let driveMode=false, carMode='idle';        // carMode: idle | manual | route
const KEY={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase(); KEY[k]=true; if(driveMode&&k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{KEY[e.key.toLowerCase()]=false;});

// ---- route waypoints ----
let routePts=DRIVEWAY.map(p=>({...p})), routeIdx=0, routeAdd=false, routeObj=null;
function drawRoute(){
  if(routeObj) scene.remove(routeObj);
  routeObj=new THREE.Group();
  if(routePts.length){
    const pts=routePts.map(p=>new THREE.Vector3(p.x,heightAt(p.x,p.z)+1.2,p.z));
    if(pts.length>1) routeObj.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffcc33})));
    for(const p of pts){const m=new THREE.Mesh(new THREE.ConeGeometry(0.8,2.4,6),MAT(0xffcc33,.5));m.position.copy(p);m.rotation.x=Math.PI;routeObj.add(m);}
  }
  scene.add(routeObj);
}
function addWaypoint(x,z){ routePts.push({x,z}); drawRoute(); }
function clearRoute(){ routePts=[]; routeIdx=0; drawRoute(); }
drawRoute();   // show the baked default route

// ---- chase camera (lines up behind the car) ----
const _fwd=new THREE.Vector3(),_des=new THREE.Vector3(),_look=new THREE.Vector3();
let chaseDist=12, chaseHi=5;
function chaseCam(blend){
  _fwd.set(Math.sin(car.heading),0,Math.cos(car.heading));
  const y=heightAt(car.x,car.z);
  _des.set(car.x-_fwd.x*chaseDist, y+chaseHi, car.z-_fwd.z*chaseDist);
  _look.set(car.x+_fwd.x*3, y+1.3, car.z+_fwd.z*3);
  cam.position.lerp(_des,blend); cam.lookAt(_look); controls.target.copy(_look);
}
renderer.domElement.addEventListener('wheel',e=>{ if(driveMode){e.preventDefault(); chaseDist=Math.max(5,Math.min(45,chaseDist+e.deltaY*0.02));}},{passive:false});

// ---- drive + intro cinematic ----
let introT=0, introActive=false; const introDur=4.5;
function beginDrive(mode){
  driveMode=true; carMode=mode; controls.enabled=false; introActive=false;
  document.getElementById('drive').textContent='exit drive';
  if(mode==='route'&&routePts.length){ car.x=routePts[0].x; car.z=routePts[0].z; routeIdx=1;
    if(routePts[1]) car.heading=Math.atan2(routePts[1].x-car.x,routePts[1].z-car.z); car.speed=5; }
  if(mode==='manual') chaseCam(1);
}
function endDrive(){ driveMode=false; carMode='idle'; introActive=false; controls.enabled=true;
  controls.target.set(0,heightAt(0,0),0); controls.update();
  document.getElementById('drive').textContent='drive the RAV4'; }
function playIntro(){ if(routePts.length<2){info.innerHTML='add at least 2 waypoints first';return;}
  beginDrive('route'); const y=heightAt(car.x,car.z); cam.position.set(car.x+35,y+55,car.z+35); introActive=true; introT=0; }

function updateCar(dt){
  if(!driveMode) return;
  if(carMode==='manual'){
    const f=(KEY['arrowup']||KEY['w']?1:0)-(KEY['arrowdown']||KEY['s']?1:0);
    car.speed+=f*22*dt; car.speed*=(1-1.3*dt); car.speed=Math.max(-7,Math.min(18,car.speed));
    const s=(KEY['arrowleft']||KEY['a']?1:0)-(KEY['arrowright']||KEY['d']?1:0);
    car.heading+=s*1.3*dt*Math.max(-1,Math.min(1,car.speed/2));
  } else if(carMode==='route'){
    let tgt=routePts[Math.min(routeIdx,routePts.length-1)];
    let dx=tgt.x-car.x, dz=tgt.z-car.z, dist=Math.hypot(dx,dz);
    const passed=(dx*Math.sin(car.heading)+dz*Math.cos(car.heading))<0;   // waypoint is behind us
    if(dist<6 || (passed && dist<12)){                                   // hug the waypoint before advancing
      if(routeIdx<routePts.length-1){ routeIdx++; tgt=routePts[routeIdx]; dx=tgt.x-car.x; dz=tgt.z-car.z; dist=Math.hypot(dx,dz); }
      else { carMode='manual'; introActive=false; }                       // end of road → you take over
    }
    let dh=Math.atan2(dx,dz)-car.heading; dh=Math.atan2(Math.sin(dh),Math.cos(dh));
    car.heading+=Math.max(-1.3*dt,Math.min(1.3*dt,dh));                   // slower, smoother turns
    car.speed+=((Math.abs(dh)>0.8?5:9)-car.speed)*1.6*dt;                 // ease off for sharp turns
  }
  car.x+=Math.sin(car.heading)*car.speed*dt; car.z+=Math.cos(car.heading)*car.speed*dt;
  const y=heightAt(car.x,car.z);
  car.group.position.set(car.x,y,car.z); car.group.rotation.y=car.heading;
  const spin=car.speed*dt/0.36; for(const w of wheels) w.rotation.x+=spin;
  if(introActive){ introT+=dt; chaseCam(Math.min(0.15,0.02+0.13*(introT/introDur))); if(introT>=introDur) introActive=false; }
  else chaseCam(0.12);
}

// ---- photo-match camera -------------------------------------------------
let camGizmo=null;
function dropCamera(){
  if(camGizmo) scene.remove(camGizmo);
  camGizmo=new THREE.Group();
  box(camGizmo,3,2,4,0,0,0,MAT(0x1a1a1a,.4,.4));
  const lens=new THREE.Mesh(new THREE.ConeGeometry(1.1,2.4,12),MAT(0x0a0a0a,.3,.5));lens.rotation.x=-Math.PI/2;lens.position.z=3;camGizmo.add(lens);
  camGizmo.position.copy(cam.position); camGizmo.lookAt(controls.target); scene.add(camGizmo);
  const east=cam.position.x,north=-cam.position.z,elev=gmin+cam.position.y/VEX;
  info.innerHTML=`📷 camera dropped<br>E ${east.toFixed(0)} · N ${north.toFixed(0)} m<br>eye ${elev.toFixed(0)} m (${(elev*3.28084).toFixed(0)} ft)`;
}

// ---- UI wiring ----------------------------------------------------------
const $=id=>document.getElementById(id);
$('vex').oninput=e=>{$('vexv').textContent=(+e.target.value).toFixed(1)+'×';applyVex(+e.target.value);};
$('groundDetail').onchange=()=>groundDetail.uniforms.detailEnabled.value=$('groundDetail').checked?1:0;

  $('mode').textContent=aerial?'show elevation colors':'show aerial photo';};

$('rmtree').onclick=()=>{ if(selTree){const id=selTree.id; removedTrees.add(id); selTree=null; buildTreesFrom(+$('treeN').value); info.innerHTML='removed tree #'+id;} else info.innerHTML='click a tree first'; };
$('cptree').onclick=()=>{ $('dump').value=JSON.stringify([...removedTrees]); try{navigator.clipboard.writeText($('dump').value);}catch(e){} info.innerHTML=removedTrees.size+' removed ids copied'; };
$('drive').onclick=()=> driveMode?endDrive():beginDrive('manual');

$('rcopy').onclick=()=>{const t=routePts.map(p=>({E:+p.x.toFixed(1),N:+(-p.z).toFixed(1)})); $('rdump').value=JSON.stringify(t); try{navigator.clipboard.writeText($('rdump').value);}catch(e){}};
function setPanel(open){$('panel').style.display=open?'block':'none'; $('fab').style.display=open?'none':'block';}
$('min').onclick=()=>setPanel(false); $('fab').onclick=()=>setPanel(true);
setPanel(false);   // start collapsed — just the ＋ button
const bindHold=(id,key)=>{const b=$(id); b.addEventListener('pointerdown',e=>{e.preventDefault();KEY[key]=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>KEY[key]=false));};
bindHold('dU','arrowup'); bindHold('dD','arrowdown'); bindHold('dL','arrowleft'); bindHold('dR','arrowright');
const ov=$('ov');
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;ov.src=URL.createObjectURL(f);ov.style.display='block';$('ovtog').textContent='hide';};
$('ovop').oninput=e=>ov.style.opacity=e.target.value;

$('fov').oninput=e=>{$('fovv').textContent=e.target.value+'°';cam.fov=+e.target.value;cam.updateProjectionMatrix();};
$('stand').onclick=()=>{                    // put the eye at the marker (photographer spot), look at the buildings
  let tx=0,tz=0; if(placed.length){for(const o of placed){tx+=o.x;tz+=o.z;}tx/=placed.length;tz/=placed.length;}
  controls.target.set(tx,heightAt(tx,tz)+3,tz);
  cam.position.set(marker.position.x,heightAt(marker.position.x,marker.position.z)+1.6,marker.position.z);
  controls.update();
};
$('dropcam').onclick=dropCamera;
$('nw').onclick=()=>nudge(-1,0); $('ne').onclick=()=>nudge(1,0); $('nn').onclick=()=>nudge(0,1); $('ns').onclick=()=>nudge(0,-1);
$('copy').onclick=()=>{const txt=JSON.stringify(dumpLayout(),null,1); $('dump').value=txt; try{navigator.clipboard.writeText(txt);}catch(e){} $('dump').select();};
$('topview').onclick=()=>{controls.target.set(0,heightAt(0,0),0); cam.position.set(0,gmin+relief+380,0.1); controls.update();};

$('hud').innerHTML=`<b>Paradise Valley, MT</b><br>wide ${(2*cHalf).toFixed(0)} m · center ${(2*fHalf).toFixed(0)} m @1m<br>`+
  `elev ${M.globalMin.toFixed(0)}–${M.globalMax.toFixed(0)} m · relief ${relief.toFixed(0)} m<br>drag orbit · tap = coords`;

// ---- flatten a building pad into the slope: carve terrain in a rect down to `padY`, ramping out over `blend` metres ----
function flattenPad(cx,cz,halfW,halfD,padY,blend){ blend=blend||3;
  for(const t of tiles){ for(let i=0;i<t.pos.count;i++){ const x=t.pos.getX(i), z=t.pos.getZ(i);
    const m=Math.max(Math.abs(x-cx)-halfW, Math.abs(z-cz)-halfD);   // 0 inside the pad, grows outside
    const w = m<=0?1:(m>=blend?0:1-m/blend);
    if(w>0) t.baseY[i]=t.baseY[i]*(1-w)+padY*w; } }   // applyVex re-applies baseY->pos.y + re-places the house at heightAt
}
{ // set the house into the hill: pad at the average grade across the footprint (~driveway level; back cuts into the slope, front near grade)
  const hx=8, hz=-8, hw=13, hd=8;
  let sum=0, n=0;
  for(let a=-hw;a<=hw;a+=hw/3) for(let b=-hd;b<=hd;b+=hd/3){ sum+=heightAt(hx+a,hz+b); n++; }
  const padY = sum/n - 0.3;        // average grade, just recessed
  flattenPad(hx,hz,hw,hd,padY,5);
}
applyVex(1);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setSize(innerWidth,innerHeight);
const cmp=document.querySelector('#compass span');
controls.target.set(0,heightAt(0,0),0); controls.update();   // pivot on the ground, not underground
const _pd=new THREE.Vector3(), _pr=new THREE.Vector3(), _pu=new THREE.Vector3(0,1,0), _pm=new THREE.Vector3();
function panCam(dt){                                    // WASD translates the camera in builder mode
  const f=(KEY['w']?1:0)-(KEY['s']?1:0), st=(KEY['d']?1:0)-(KEY['a']?1:0);
  if(!f&&!st) return;
  cam.getWorldDirection(_pd); _pd.y=0; if(_pd.lengthSq()<1e-6) return; _pd.normalize();
  _pr.crossVectors(_pd,_pu).normalize();
  const spd=Math.min(250,Math.max(10,cam.position.distanceTo(controls.target)*0.5))*dt;
  _pm.set(0,0,0).addScaledVector(_pd,f*spd).addScaledVector(_pr,st*spd);
  cam.position.add(_pm); controls.target.add(_pm);
}
const AUTO_INTRO=true; if(AUTO_INTRO) playIntro();   // start with the car driving down the road
let lastT=performance.now(), frames=0, fpsT=lastT; const statsEl=document.getElementById('stats');
(function loop(){requestAnimationFrame(loop);
  const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  updateCar(dt); if(!driveMode){ panCam(dt); controls.update(); }
  if(impCamU) impCamU.value.copy(cam.position);     // keep billboards facing the camera (MeshBasic won't auto-update it)
  updateTreeLOD();                                  // swap detailed↔billboard by distance from the camera
  const v=new THREE.Vector3(0,0,-1).project(cam);
  cmp.style.top=(26-v.y*20-8)+'px';cmp.style.left=(26+v.x*20-4)+'px';
  renderer.render(scene,cam);
  frames++; if(now-fpsT>=300){const fps=frames*1000/(now-fpsT);
    statsEl.innerHTML=`${fps.toFixed(0)} fps · ${(1000/fps).toFixed(1)} ms<br>${renderer.info.render.calls} draws · ${(renderer.info.render.triangles/1000).toFixed(0)}k tris`;
    frames=0; fpsT=now;}
})();
