// props, so set it aside once per LAYOUT: kept under montanaSetAside:<key>, not deleted. Bump LAYOUT when published edits
// supersede what browsers may hold. Quality settings stay.
{const LAYOUT='2026-11-04d',KEYS=['montanaLandscapeDraft:v1','montanaBuildingTransforms:v1','montanaTerrainPaint:v1','montanaHouse','montanaGarage','montanaShed'];
 try{if(localStorage.getItem('montanaLayout')!==LAYOUT){
  for(const k of KEYS){const v=localStorage.getItem(k);if(v===null)continue;localStorage.removeItem(k);try{localStorage.setItem('montanaSetAside:'+k,v);}catch(e){}}
  for(const k of ['montanaPlantCensus:v1','montanaReferenceEdits:v1'])localStorage.removeItem(k);
  localStorage.setItem('montanaLayout',LAYOUT);}}catch(e){}}
// The straight-down photo's published camera was replaced by a solved one; a browser still holding the old copy would keep showing it.
{try{const k='montanaPhotoAlignments:v1',a=JSON.parse(localStorage.getItem(k)||'{}'),o=a&&a.overhead;
 if(o&&o.position&&Math.abs(o.position[0]+12.1681)<.01&&Math.abs(o.position[2]-14.1959)<.01){delete a.overhead;localStorage.setItem(k,JSON.stringify(a));}}catch(e){}}

// collapse a building's ~100s of little box meshes into one merged mesh per material → far fewer draw calls
function matKey(m){if(Array.isArray(m))m=m[0];return m?.uuid||'x';} // do not merge glass or differently mapped surfaces by color alone
function optimizeGroup(g){
  const groups=new Map();
  for(const o of [...g.children]){
    if(!o.isMesh || !o.geometry.attributes.uv) continue;
    o.updateMatrix(); const geo=o.geometry.clone().applyMatrix4(o.matrix);
    const k=matKey(o.material);
    if(!groups.has(k)) groups.set(k,{mat:o.material,geos:[]});
    groups.get(k).geos.push(geo); g.remove(o);
  }
  for(const {mat,geos} of groups.values()){
    // Boxes are indexed, extruded gables are not. Normalize that difference
    // before merging, so additional editable details do not add hundreds of draws.
    const mixedIndices=geos.some(geo=>Boolean(geo.index)!==Boolean(geos[0].index));
    const prepared=mixedIndices?geos.map(geo=>geo.index?geo.toNonIndexed():geo):geos;
    const merged=mergeGeometries(prepared,false);
    if(merged){g.add(new THREE.Mesh(merged,mat));for(const geo of new Set([...geos,...prepared]))geo.dispose();}
    else {geos.forEach(ge=>g.add(new THREE.Mesh(ge,mat)));for(const geo of prepared)if(!geos.includes(geo))geo.dispose();}

  const body=MAT(0xededed,.5,.1), clad=MAT(0x20242b,.5), glass=MAT(0x2a3038,.2,.3), blk=MAT(0x1a1a1a,.6),
        red=MAT(0x8a1a1a,.4), lamp=MAT(0xf7f4e0,.3);

function updateCar(dt){

  if(carMode==='route'&&DRIVE_KEYS.some(k=>KEY[k])){carMode='manual';routeDriver=null;}
