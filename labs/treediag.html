<!doctype html><html><head><meta charset="utf-8"><title>diag</title>
<style>html,body{margin:0;height:100%;background:#9fc3e8;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
const want=new URLSearchParams(location.search).get('v')||'aspen';
const at=parseFloat(new URLSearchParams(location.search).get('at')||'0.32');
const transparent=new URLSearchParams(location.search).get('bg')==='0';   // impostor bake mode
if(transparent){ document.documentElement.style.background='transparent'; document.body.style.background='transparent'; }
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:transparent,preserveDrawingBuffer:transparent}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); if(transparent){ renderer.setClearColor(0x000000,0); } else { scene.background=new THREE.Color(0x9fc3e8); }
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,2000); cam.position.set(0,10,34); cam.lookAt(0,9,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x668855,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(30,50,40); scene.add(sun);
if(!transparent) scene.add(new THREE.Mesh(new THREE.CircleGeometry(200,32).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x5c6b3a,roughness:1})));
const man=await (await fetch('../assets/trees/manifest.json?v=7')).json();
const v=man.variants.find(v=>v.name===want);
const q=new URLSearchParams(location.search);
const tl=new THREE.TextureLoader();
const T=(u,s)=>{const t=tl.load('../assets/trees/'+u,()=>console.log('LOADED',u),undefined,e=>console.error('TEXFAIL',u)); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(s)t.encoding=THREE.sRGBEncoding; return t;};
const dec=(s)=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const f32=s=>new Float32Array(dec(s)),u32=s=>new Uint32Array(dec(s));
const mk=p=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(f32(p.position),3));g.setAttribute('normal',new THREE.BufferAttribute(f32(p.normal),3));const uv=f32(p.uv);g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setAttribute('uv2',new THREE.BufferAttribute(uv,2));if(p.index)g.setIndex(new THREE.BufferAttribute(u32(p.index),1));return g;};
const d=await (await fetch('../assets/trees/'+v.file+'?v=7')).json();
const btex=q.get('btex')? 'tex/'+q.get('btex') : v.tex.barkColor;
const ltex=q.get('ltex')? 'tex/'+q.get('ltex') : v.tex.leaf;
const bark=new THREE.Mesh(mk(d.branches),new THREE.MeshStandardMaterial({map:T(btex,true),roughness:1}));
const leafTex=T(ltex,true);
const leaf=new THREE.Mesh(mk(d.leaves),new THREE.MeshStandardMaterial({map:leafTex,alphaTest:at,side:THREE.DoubleSide,roughness:1}));
for(const m of [bark,leaf]){m.scale.setScalar(18);scene.add(m);}
// report leaf material/alpha stats once the leaf texture is loaded
leafTex.image ? report() : (leafTex.addEventListener?leafTex.addEventListener('load',report):setTimeout(report,1500));
function report(){
  const img=leafTex.image; window.__diag={variant:want,alphaTest:at,leafImg:img?(img.width+'x'+img.height):'none',
    leafCards:d.leaves.uv_n/4, barkVerts:d.branches.position_n};
}
function computeBBox(){   // tight alpha bounding box of the rendered tree (for cropping the impostor)
  const cv=renderer.domElement, W=cv.width, H=cv.height;
  const c2=document.createElement('canvas'); c2.width=W; c2.height=H;
  const ctx=c2.getContext('2d'); ctx.drawImage(cv,0,0);
  const d=ctx.getImageData(0,0,W,H).data; let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(d[(y*W+x)*4+3]>12){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  window.__bbox=(x1>=x0)?{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1}:null;
}
setTimeout(()=>{ for(let i=0;i<4;i++) renderer.render(scene,cam); report(); if(transparent) computeBBox(); window.__ready=true; }, 3200);
</script></body></html>
