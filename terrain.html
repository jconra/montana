<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Terrain — Paradise Valley 24ac</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;font-family:system-ui,sans-serif;color:#e6edf3}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;top:10px;left:10px;font-size:12px;line-height:1.5;
       background:rgba(13,17,23,.7);padding:8px 10px;border-radius:8px;pointer-events:none}
  #hud b{color:#7ee787}
  #panel{position:fixed;bottom:10px;left:10px;background:rgba(13,17,23,.7);
          padding:8px 10px;border-radius:8px;font-size:12px}
  #panel label{display:flex;align-items:center;gap:8px}
  input[type=range]{width:140px}
  #compass{position:fixed;top:10px;right:10px;width:56px;height:56px;
           background:rgba(13,17,23,.7);border-radius:50%;font-size:11px}
  #compass span{position:absolute;left:50%;transform:translateX(-50%);top:4px;color:#ff7b72;font-weight:bold}
  #err{position:fixed;bottom:0;left:0;right:0;background:#7d1d1d;color:#fff;
       font:12px monospace;padding:6px;white-space:pre-wrap;display:none;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="compass"><span>N</span></div>
<div id="panel">
  <label>vertical scale <input id="vex" type="range" min="0.5" max="3" step="0.1" value="1"><span id="vexv">1.0×</span></label>
  <label style="margin-top:6px"><button id="mode" style="cursor:pointer">show elevation colors</button></label>
</div>
<div id="err"></div>
<script>
window.onerror=(m,s,l)=>{const e=document.getElementById('err');e.style.display='block';e.textContent+=m+' @'+l+'\n';};
</script>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hud = document.getElementById('hud');

const meta = await (await fetch('./assets/terrain/dem_meta.json')).json();
const buf  = await (await fetch('./assets/terrain/dem.bin')).arrayBuffer();
const elev = new Float32Array(buf);
const { W, H, min, max, pxX, pxY } = meta;
const spanX = (W-1)*pxX, spanZ = (H-1)*pxY;   // ground size in meters
const relief = max - min;

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 20000);
cam.position.set(spanX*0.7, relief*2.2+250, spanZ*0.9);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;

// lights — low sun for strong hillshade relief
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x2a2420, 0.55));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.5);
sun.position.set(-1, 1.3, -0.6);          // NW morning sun
scene.add(sun);

// geometry: plane in XZ, Y = elevation. Row 0 = north (NW top-left).
const geo = new THREE.PlaneGeometry(spanX, spanZ, W-1, H-1);
geo.rotateX(-Math.PI/2);                   // lay flat, +Z south
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count*3);

// hypsometric ramp: forest -> meadow -> rock -> snow-ish
function ramp(t){
  const stops=[[0.00,0x2d4a1e],[0.35,0x5a6b33],[0.60,0x8a7a4e],[0.82,0x8f8175],[1.0,0xd9d2c4]];
  for(let i=0;i<stops.length-1;i++){
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if(t<=b){const u=(t-a)/(b-a);
      const r=(ca>>16&255)+((cb>>16&255)-(ca>>16&255))*u;
      const g=(ca>>8&255)+((cb>>8&255)-(ca>>8&255))*u;
      const bl=(ca&255)+((cb&255)-(ca&255))*u;
      return [r/255,g/255,bl/255];}
  }
  return [1,1,1];
}
const baseY = new Float32Array(pos.count);
for(let i=0;i<pos.count;i++){
  const e = elev[i];
  baseY[i] = e - min;                       // 0..relief
  const t = relief>0 ? (e-min)/relief : 0;
  const [r,g,b]=ramp(t);
  colors[i*3]=r; colors[i*3+1]=g; colors[i*3+2]=b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors,3));

// aerial photo texture (NAIP), draped via the plane's default UVs (north-up aligned)
const tex = new THREE.TextureLoader().load('./assets/terrain/aerial.jpg');
tex.encoding = THREE.sRGBEncoding;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const mat = new THREE.MeshStandardMaterial({map:tex, roughness:1, metalness:0, flatShading:false});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

// toggle: real aerial photo  <->  elevation color ramp
let aerial = true;
const modeBtn = document.getElementById('mode');
modeBtn.onclick = ()=>{
  aerial = !aerial;
  mat.map = aerial ? tex : null;
  mat.vertexColors = !aerial;
  mat.color.set(0xffffff);
  mat.needsUpdate = true;
  modeBtn.textContent = aerial ? 'show elevation colors' : 'show aerial photo';
};

function applyVex(v){
  for(let i=0;i<pos.count;i++) pos.setY(i, baseY[i]*v);
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}
applyVex(1);

const vex=document.getElementById('vex'), vexv=document.getElementById('vexv');
vex.oninput=()=>{ vexv.textContent=(+vex.value).toFixed(1)+'×'; applyVex(+vex.value); };

// keep compass pointing to world -Z (north)
const compass=document.getElementById('compass').firstElementChild;

hud.innerHTML = `<b>Paradise Valley, MT</b><br>`+
  `area: ${(spanX).toFixed(0)}×${(spanZ).toFixed(0)} m (~${((spanX*spanZ)/4046.86).toFixed(0)} ac)<br>`+
  `elev: ${min.toFixed(0)}–${max.toFixed(0)} m<br>`+
  `relief: ${relief.toFixed(0)} m (${(relief*3.28084).toFixed(0)} ft)<br>`+
  `1 m LiDAR · ${W}×${H}`;

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setSize(innerWidth,innerHeight);
(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  // rotate compass N marker to screen
  const v=new THREE.Vector3(0,0,-1).project(cam);
  compass.style.top = (28 - v.y*22 - 8) + 'px';
  compass.style.left = (28 + v.x*22) + 'px';
  renderer.render(scene,cam);
})();
</script>
</body>
</html>
